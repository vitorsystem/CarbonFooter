services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbonfooter-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # As duas linhas abaixo sobrescrevem o appsettings apontando para o contêiner 'mongodb'
      - MongoDbSettings__ConnectionString=mongodb://${DB_USER}:${DB_PASSWORD}@mongodb:27017/${DB_NAME}?authSource=admin
      - MongoDbSettings__DatabaseName=${DB_NAME}
    depends_on:
      - mongodb
    networks:
      - carbon-network

  mongodb:
    image: mongo:latest
    container_name: carbonfooter-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - carbon-network

volumes:
  mongodb_data:

networks:
  carbon-network:
    driver: bridge