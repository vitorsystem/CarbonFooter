name: CI/CD Pipeline - CarbonFooter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs: 

// Etapa 1 - Builds e Testes

  build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v2
      
      - name: Configure .NET 10
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore Dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test --no-build --configuration Release --verbosity normal
      
// Etapa 2 - Deploy Staging (Continuous Deployment))

  deploy-staging: 
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Code Checkout
        users: actions/checkout@v2

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        run: echo "Deploying to Azure Web App..."
       # run: az webapp up --name carbonfooter-staging --resource-group rg-esg

   deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        run: echo "Deploying to Azure Web App..."
       # run: az webapp up --name carbonfooter-production --resource-group rg-esg